name: wallet_balance_app
description: "Wallet Balance — cartão de crédito, fatura, extrato e gráficos."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # External dependencies.
  connectivity_plus: ^7.1.1
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  fl_chart: ^0.70.2
  get_it: ^9.3.0
  go_router: ^18.0.2
  intl: ^0.20.2
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # External dev dependencies.
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  mockito: ^5.8.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
