name: wallet_balance_app
description: "Wallet Balance — cartão de crédito, fatura, extrato e gráficos."
publish_to: "none" # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  # External dependencies.
  connectivity_plus: ^7.1.1
  cupertino_icons: ^1.0.8
  dio: ^5.9.2
  fl_chart: ^0.70.2
  get_it: ^9.2.1
  go_router: ^17.2.3
  intl: ^0.20.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  # External dev dependencies.
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  mockito: ^5.6.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
